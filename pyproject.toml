[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-dojo"
version = "0.1.0"
description = "中文量化投资学习与实战平台：体系化课程 + 因子研究 + 回测 + 过拟合检验"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "pyarrow>=14",          # MarketData.to_parquet / from_parquet
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
data = ["akshare>=1.12", "pyarrow>=14"]
dev = ["pytest>=8.0", "httpx"]

[project.scripts]
qd = "qd.cli:main"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.setuptools]
include-package-data = true
