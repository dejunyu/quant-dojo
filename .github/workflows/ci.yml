name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # 关键：以「真实用户」的方式安装项目本身（pip install -e .），
        # 而不是只装 requirements.txt。否则打包配置的问题会被
        # pytest.ini 里的 pythonpath 掩盖掉（这正是之前 CI 一直红的原因）。
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: 验证安装（从仓库外导入，确保用的是已安装的包）
        run: |
          cd /tmp
          python -c "import qd, qd.data, qd.factors, qd.backtest, qd.research, qd.metrics, qd.optimize, qd.strategy, qd.live, qd.tutor; print('qd', qd.__version__, 'installed OK')"
          qd lessons | head -4

      - name: 1/7 数据层
        run: pytest tests/test_data.py -v --tb=short

      - name: 2/7 因子层
        run: pytest tests/test_factors.py -v --tb=short

      - name: 3/7 回测与绩效
        run: pytest tests/test_backtest.py -v --tb=short

      - name: 4/7 研究与优化
        run: pytest tests/test_research.py -v --tb=short

      - name: 5/7 API 与实盘
        run: pytest tests/test_api.py -v --tb=short

      - name: 6/7 无前视偏差证明
        run: pytest tests/test_no_lookahead.py -v --tb=short

      - name: 7/7 教材一致性（课程代码块必须全部真实执行通过）
        run: pytest tests/test_docs.py -v --tb=short

      - name: 命令行自检
        run: |
          qd factor mom_12_1 --report | head -30
          qd backtest dual_momentum | head -12

      - name: 失败诊断（始终执行，便于排查）
        if: failure()
        run: |
          {
            echo "== python =="
            python -V
            echo "== platform =="
            python -c "import sys; print(sys.platform)"
            echo "== versions =="
            pip list 2>/dev/null | grep -iE "numpy|pandas|scipy|scikit|pyarrow|fastapi|pytest"
            echo "== qd location =="
            cd /tmp && python -c "import qd; print(qd.__file__)"
            echo "== failing test (full traceback) =="
            pytest tests/ --ignore=tests/test_docs.py -x --tb=long 2>&1 | tail -60
          } > ci-diagnostic.txt 2>&1 || true
          cat ci-diagnostic.txt

      - name: 上传失败诊断
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostic-py${{ matrix.python-version }}
          path: ci-diagnostic.txt
          if-no-files-found: ignore
