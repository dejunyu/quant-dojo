name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 核心测试（数据 / 因子 / 回测 / 研究 / API / 实盘）
        run: pytest tests/ --ignore=tests/test_docs.py -q

      - name: 无前视偏差证明
        run: pytest tests/test_no_lookahead.py -v

      - name: 教材一致性（71 个课程代码块必须全部真实执行通过）
        run: pytest tests/test_docs.py -v

      - name: 命令行全流程自检
        run: |
          export PYTHONPATH=engine
          python -m qd lessons --detail | head -20
          python -m qd factor mom_12_1 --report | head -40
